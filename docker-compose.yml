#       - EXPLORE_ROOT=/explore
#       - ENABLE_WRITE=true            # ← enables PUT /api/browse/file
#       # Strongly recommended when write mode is on:
#       # - UI_ACCESS_TOKEN=change-me-to-a-long-random-secret
