<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Explorer</title>
  <link rel="icon" type="image/svg+xml" href="/folder.svg">
  <link rel="stylesheet" href="/src/client/styles.css">
</head>
<body>
  <!-- ── Auth gate overlay (shown when UI_ACCESS_TOKEN is configured) ────── -->
  <div class="auth-overlay" id="auth-overlay" role="dialog" aria-modal="true" aria-labelledby="auth-title" aria-hidden="true">
    <div class="auth-modal">
      <div class="auth-modal-icon" aria-hidden="true">🔒</div>
      <h2 class="auth-modal-title" id="auth-title">File Explorer</h2>
      <p class="auth-modal-subtitle">Enter your access token to continue</p>
      <form id="auth-form" autocomplete="off">
        <input
          id="auth-token-input"
          type="password"
          class="auth-input"
          placeholder="Access token"
          autocomplete="current-password"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          aria-label="Access token"
          required
        />
        <button type="submit" id="auth-submit-btn" class="btn btn-primary auth-submit-btn">
          Unlock
        </button>
      </form>
      <div id="auth-error" class="auth-error" role="alert" aria-live="polite"></div>
    </div>
  </div>

  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <button
          class="theme-toggle sidebar-toggle"
          id="sidebar-toggle"
          aria-label="Toggle file list"
          aria-expanded="false"
          aria-controls="sidebar"
          title="Toggle file list"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <h1 class="logo">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
          File Explorer
        </h1>
        <div class="breadcrumb" id="breadcrumb">
          <!-- Populated by JS -->
        </div>
        <!-- Lock button (visible only when auth is active) -->
        <button
          class="theme-toggle lock-btn"
          id="lock-btn"
          aria-label="Lock — clear session and re-show access gate"
          title="Lock explorer"
          style="display:none"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </button>
        <button
          class="theme-toggle"
          id="theme-toggle"
          aria-label="Toggle light/dark mode"
          title="Toggle light/dark mode"
        >
          <!-- Sun icon (shown in dark mode) -->
          <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <!-- Moon icon (shown in light mode) -->
          <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main content -->
    <main class="main">
      <div class="container">
        <!-- Mobile sidebar backdrop -->
        <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>

        <!-- Sidebar (file list) -->
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-header">
            <button
              class="theme-toggle refresh-btn"
              id="refresh-btn"
              aria-label="Refresh file list"
              title="Refresh file list"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <polyline points="23 4 23 10 17 10"/>
                <polyline points="1 20 1 14 7 14"/>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
              </svg>
              <span>Refresh</span>
            </button>
          </div>
          <div class="file-list" id="file-list">
            <!-- Populated by JS -->
          </div>
        </aside>

        <!-- Preview panel -->
        <section class="preview-panel" id="preview-panel">
          <div class="preview-content" id="preview-content">
            <div class="preview-placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
              </svg>
              <p>Select a file to preview</p>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- Loading overlay -->
    <div class="loading-overlay" id="loading">
      <div class="spinner"></div>
    </div>

    <!-- Error toast -->
    <div class="error-toast" id="error-toast">
      <span id="error-message"></span>
      <button class="error-close" onclick="hideError()">&times;</button>
    </div>
  </div>

  <script type="module" src="/src/client/main.ts"></script>
</body>
</html>
